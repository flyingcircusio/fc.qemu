[project]
name = "fc.qemu"
version = "1.8.dev0"

description = "Qemu VM management utilities"
authors = [
  {name = "Flying Circus IO GmbH <mail@flyingcircus.io>", email = "mail@flyingcircus.io" }
]

requires-python = "==3.13.*"
dependencies = [
    # keep-sorted start
    "PyYaml>=5.3.1",
    "colorama>=0.3.3",
    "consulate",
    "psutil>=5.4.2",
    "pydantic>=2.13.4",
    "requests>=2.11.1",
    "setuptools>=75.1",
    "structlog>=16.1.0",
    "websockets>=13.1",
    # keep-sorted end
]


[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
consulate = { git = "https://github.com/flyingcircusio/consulate", rev = "90e46a4f307e281bf0e050d510fa367fd2826a2f" }

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/"]
include = ["fc.qemu", "fc.qemu.hazmat"]

[dependency-groups]
dev = [
    # keep-sorted start
    "mock>=5.2",
    "pyright>=1.1.411",
    "pytest-cov>=6.2.1",
    "pytest-flakefinder>=1.1.0",
    "pytest-patterns>=0.3.0",
    "pytest-profiling>=1.8.1",
    "pytest-timeout>=2.4.0",
    "pytest>=9.0",
    # keep-sorted end
]

[project.scripts]
# keep-sorted start
fc-qemu = "fc.qemu.main:main"
supervised-qemu = "fc.qemu.hazmat.supervise:main"
# keep-sorted end

[tool.ruff]
line-length = 80

[tool.zest-releaser]
version-levels = 3
history-file = "CHANGES.txt"
register = false
release = false

[tool.scriv]
format = "rst"
fragment_directory = "CHANGES.d"
output_file = "CHANGES.txt"
version = "unreleased"
entry_title_template = ""
rst_header_chars = "-~"
insert_marker = "- Nothing changed yet."
categories = ""

[tool.basedpyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = [
    # keep-sorted start
    ".venv/**",
    "batou/**",
    "tests/**",
    "typings/**"
    # keep-sorted end
]
